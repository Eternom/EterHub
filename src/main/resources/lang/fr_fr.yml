    title: "<accent>Re, <player> !"
    subtitle: "<info>Le village t'attendait"
    message: "<info>Content de te revoir ! <dark_gray>· <click:open_url:'<wiki>'><accent><u>Wiki</u></accent></click> <dark_gray>· <click:open_url:'<discord>'><accent><u>Discord</u></accent></click> <dark_gray>· <click:open_url:'<shop>'><accent><u>Boutique</u></accent></click>"

