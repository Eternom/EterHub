# EterHub messages, MiniMessage format. Palette tags: <primary> <accent> <info> <error> <success>
# A missing key falls back to the text bundled with the plugin: keep only the lines you change.

command:
  no-permission: "<error>You don't have permission."

zones:
  spawn:
    name: "<accent>Spawn Square"
    subtitle: "<info>The heart of the village"
  guilde:
