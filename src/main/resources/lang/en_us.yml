    title: "<accent>Welcome back, <player>!"
    subtitle: "<info>The village missed you"
    message: "<info>Good to see you again! <dark_gray>· <click:open_url:'<wiki>'><accent><u>Wiki</u></accent></click> <dark_gray>· <click:open_url:'<discord>'><accent><u>Discord</u></accent></click> <dark_gray>· <click:open_url:'<shop>'><accent><u>Shop</u></accent></click>"

