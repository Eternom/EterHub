    particles:
      - {type: FIREWORK, count: 2, radius: 10, min-y: 3, max-y: 8, every: 4, chance: 0.4, speed: 0.02}
      - {type: GLOW, count: 2, radius: 8, min-y: 0, max-y: 3, every: 3, chance: 0.5}

# Découverte du village : la première visite de chaque lieu (discoverable) est retenue.
discovery:
  # Aller à un lieu découvert depuis la carte (/map).
  teleport: true
  # Récompenses (commandes console, {player} = pseudo ; ou « action: <action d'EterLib> »).
  reward-each: []
  reward-all:
    - "action: eterlib:title \"<accent>Explorateur\" \"<info>Tout le village découvert !\""

# Portes des donjons (action eterhub:door <lieu> sur un PNJ ou un panneau) : serveur de destination, vide = fermée.
doors:
  donjon: ""
  donjon-secret: ""

# ---------- Arrivée ----------
arrival:
  # Revenir à sa dernière position au lobby (sinon un point d'arrivée de la place du Spawn).
  return-to-last-position: false
  # Vitesse de marche au village : 0 = normale, 1 = un peu plus vite, jusqu'à 5. Remise à la normale au départ.
  speed-level: 1
  # Tout le monde en survie au lobby (récolter, pêcher...), sauf le staff (eterhub.staff) qui garde son mode.
  force-survival: true
  # Message de bienvenue (lang/ welcome.first.message / welcome.back.message).
  message: true
  sound: "minecraft:block.note_block.chime"
  first-sound: "minecraft:ui.toast.challenge_complete"

# Liens du message de bienvenue (<wiki>, <discord>, <shop> dans lang/).
links:
  wiki: "https://etercraft.be/wiki"
  discord: "https://discord.gg/HGVUMcJeJ3"
  shop: "https://etercraft.be/boutique"

# /spawn : court délai d'EterLib (annulé si l'on bouge), puis un effet.
spawn-command:
  warmup: true

# Visite guidée (première venue, ou /tour) : les lieux dans l'ordre ; texte de chaque étape : lang/ tour.steps.<lieu>.
tour:
  steps: [guilde, banque, cathedrale, colisee, donjon]
  reward: []

world:
  # Heure figée du monde (0 = matin, 6000 = midi, 18000 = minuit) ; -1 = cycle normal. Les lieux ont leur propre heure.
  time: 6000
  clear-weather: true
  natural-mobs: false
  # Sous cette hauteur, retour au spawn. Par monde : void-y-per-world.<monde>.
  void-y: -64
  void-y-per-world: {}

# ---------- Mouvement ----------
double-jump:
  enabled: true
  power: 1.2
  height: 0.9
  cooldown-ms: 600

# Plaques posées en jeu : /eterhub pad add <launch|elevator|speed|teleport> [force] [hauteur] [fixe] (bloc où l'on est),
# pad mark (cible d'un téléporteur), pad remove, pad list. Ascenseur : sauter monte, s'accroupir descend.
launch-pads:
  enabled: true
  # Plaques de lancement d'un type de bloc (partout), comme avant 2.0.
  plate: LIGHT_WEIGHTED_PRESSURE_PLATE
  power: 2.5
  height: 1.0
  # Trampolines : ce bloc fait rebondir (vide = aucun).
  trampoline: SLIME_BLOCK
  trampoline-power: 1.4
  # Couloirs de vitesse : marcher sur ces blocs rend plus rapide quelques secondes.
  speed-blocks: []

# Cosmétiques selon le grade (permissions à donner aux groupes LuckPerms) :
# trails : traînée du double saut (eterhub.trail.<id>) ; auras : particules autour du joueur (eterhub.aura.<id>).
# Dans l'ordre : la dernière que le joueur a l'emporte.
cosmetics:
  enabled: true
  zone-particles: true
  trails:
    nuage: CLOUD
    coeur: HEART
    note: NOTE
    flamme: FLAME
    ame: SOUL_FIRE_FLAME
    totem: TOTEM_OF_UNDYING
  auras:
    enchantement: ENCHANT
    etoiles: END_ROD
    cerise: CHERRY_LEAVES

social:
  # S'asseoir sur les escaliers et dalles (clic droit main vide), là où la règle sit le permet.
  sit: true
  # Profil d'un joueur d'un clic droit sur lui (main vide).
  profile-on-click: true

tips:
  enabled: true
  interval-seconds: 45

# ---------- Activités ----------
# Pêche au Lac, à la vraie canne : la ligne ne se lance que là où la règle fishing est permise. Ce qui mord devient un
# poisson du lac tiré ci-dessous : un vrai objet (nom, rareté, poids, date ; données gardées dans l'objet pour un futur
# PNJ qui les reprendra), que seul le pêcheur ramasse. Noms : lang/ fishing.fish.<id> ; objet : lang/ fishing.item.
fishing:
  # Le poissonnier (action eterhub:fishmonger sur un PNJ du lac) rachète les poissons du lac, payés par EterEconomy.
  # Prix = base + per-kg × poids, selon la rareté ; le poisson du jour (le même partout, change à minuit) × daily-bonus.
  market:
    daily-bonus: 2
    prices:
      common: {base: 4, per-kg: 3}
      uncommon: {base: 10, per-kg: 5}
      rare: {base: 35, per-kg: 8}
      legendary: {base: 150, per-kg: 15}
  # Annoncer aussi les prises rares (les légendaires le sont toujours), sur tous les lobbys.
  announce-rare: false
  # Récompenses par rareté (commandes console ou « action: ... »).
  reward-common: []
  reward-uncommon: []
  reward-rare: []
  reward-legendary: []
  # chance : relative ; min / max : poids en kg.
  fish:
    gardon: {rarity: common, chance: 30, icon: COD, min: 0.2, max: 1.2}
    perche: {rarity: common, chance: 25, icon: COD, min: 0.3, max: 1.8}
    truite: {rarity: uncommon, chance: 16, icon: SALMON, min: 0.8, max: 3.5}
    sandre: {rarity: uncommon, chance: 12, icon: SALMON, min: 1.5, max: 6}
    brochet: {rarity: rare, chance: 8, icon: SALMON, min: 3, max: 12}
    poisson-lune: {rarity: rare, chance: 5, icon: TROPICAL_FISH, min: 2, max: 9}
    carpe-doree: {rarity: legendary, chance: 2, icon: TROPICAL_FISH, min: 10, max: 25}
    anguille-spectrale: {rarity: legendary, chance: 1, icon: PUFFERFISH, min: 4, max: 15}
    vieille-botte: {rarity: common, chance: 1, icon: LEATHER_BOOTS, min: 0.5, max: 0.5}

# Récoltes des Champs (activities.farming) : dans les parcelles, casser une culture mûre la récolte (elle se replante et
# repousse étape par étape) ; un clic droit sur les vignes cueille une grappe (les fleurs reviennent). Chaque récolte est
# un vrai objet, de qualité normale, belle ou dorée ; le fermier (action eterhub:farmer) et le vigneron
# (eterhub:vineyard) les rachètent. daily-cap : récoltes par jour et par joueur, sur TOUT le réseau (en base).
# La parcelle du jour (la même partout, change à minuit) : récoltes payées daily-bonus fois, dorées plus souvent.
# /harvest : le carnet des récoltes. Noms : lang/ farming.crops.<id>.
farming:
  regrow-seconds: 180
  daily-bonus: 2
  daily-golden-multiplier: 2
  quality:
    fine:
      chance: 0.15
      multiplier: 2
    golden:
      chance: 0.02
      multiplier: 8
  crops:
    wheat: {block: WHEAT, item: WHEAT, price: 0.3, daily-cap: 64, buyer: farmer}
    carrot: {block: CARROTS, item: CARROT, price: 0.6, daily-cap: 32, buyer: farmer}
    potato: {block: POTATOES, item: POTATO, price: 0.6, daily-cap: 32, buyer: farmer}
    beetroot: {block: BEETROOTS, item: BEETROOT, price: 1.2, daily-cap: 16, buyer: farmer}
    grape: {block: FLOWERING_AZALEA_LEAVES, picked: AZALEA_LEAVES, item: SWEET_BERRIES, price: 1.2, daily-cap: 16, buyer: vineyard, regrow-seconds: 300}

# Fouilles du site d'Archéologie (règle dig) : cliquer plusieurs fois sur le sable / gravier suspect.
# Les trouvailles vont au musée personnel (/museum). Noms et textes : lang/ archaeology.finds.<id>.
archaeology:
  hits: 6
  respawn-seconds: 60
  reward-common: []
  reward-uncommon: []
  reward-rare: []
  reward-legendary: []
  reward-complete: []
  finds:
    tesson-bleu: {rarity: common, chance: 30, icon: BRICK}
    pointe-de-fleche: {rarity: common, chance: 25, icon: FLINT}
    piece-ancienne: {rarity: uncommon, chance: 15, icon: GOLD_NUGGET}
    poterie-du-lac: {rarity: uncommon, chance: 12, icon: DECORATED_POT}
    fragment-chronique-1: {rarity: rare, chance: 6, icon: PAPER}
    fragment-chronique-2: {rarity: rare, chance: 6, icon: PAPER}
    fragment-chronique-3: {rarity: rare, chance: 4, icon: PAPER}
    sceau-du-roi: {rarity: legendary, chance: 2, icon: HEART_OF_THE_SEA}

# Parcours d'aventure : /eterhub parkour start|checkpoint|finish|undo|delete <parcours> (bloc où l'on se tient).
# Noms : lang/ parkour.courses.<id>. Retour : deux accroupissements, une chute, ou le vide.
parkour:
  fall-distance: 6
  reward-first: []
  reward-record: []

# Chasse aux têtes : poser une tête de joueur, la viser, /eterhub head add [chasse] ; ou /eterhub head give
# [texture|pseudo] [chasse] puis la poser en mode construction (ajoutée toute seule). /heads : le menu des joueurs.
# Récompenses : commandes console ({player}) ou « action: ... ». Chasse principale ici ; chasses à thème : hunts.
heads:
  # Chaque tête trouvée : un peu d'argent (eco give, EterEssential) et un peu d'XP du pass (eterreward pass xp, EterReward).
  reward-each:
    - "eco give {player} 5"
    - "eterreward pass xp {player} 25 event"
  reward-rare:
    - "eco give {player} 25"
    - "eterreward pass xp {player} 100 event"
  # La grosse récompense : pas automatique, à récupérer auprès du PNJ de la chasse (action eterhub:heads-claim) quand
  # toutes les têtes sont trouvées ; une seule fois par saison (jusqu'à /eterhub head reset).
  reward-all:
    - "eco give {player} 3000"
    - "eterreward pass xp {player} 3600 event"
    - "action: eterlib:title \"<gold>Chasseur de têtes\" \"<info>Toutes les têtes du village !\""
  # Paliers (facultatifs) : nombre de têtes -> récompenses. Aucun pour l'instant.
  milestones: {}
  # Annonce sur tous les lobbys quand quelqu'un trouve toutes les têtes d'une chasse (avec son rang d'arrivée).
  announce-complete: true
  # Annoncer la nouvelle saison à tous quand le staff remet une chasse à zéro (/eterhub head reset).
  announce-reset: true
  # /heads hint : chaud / froid vers la tête non trouvée la plus proche ; seulement s'il en manque au plus max-missing
  # (0 = toujours), une fois toutes les cooldown-seconds.
  hint:
    enabled: true
    cooldown-seconds: 60
    max-missing: 5
  # Les têtes non trouvées scintillent pour le joueur qui passe à moins de distance blocs.
  sparkle:
    enabled: true
    distance: 10
  # Textures prêtes pour /eterhub head give <id> : la valeur « textures » (base64) d'une tête,
  # ex. depuis minecraft-heads.com (champ « Value »). Sans texture : /eterhub head give <pseudo> donne son skin.
  textures: {}
  # Chasses à thème : ouvertes entre start et end (MM-JJ, chaque année ; peut passer le Nouvel An). Fermée, ses têtes ne
  # comptent plus et disparaissent si hide-when-closed (reposées à la réouverture). Nom : lang/ heads.hunts.<id>.
  hunts:
    halloween:
      start: "10-20"
      end: "11-02"
      hide-when-closed: true
      reward-each:
        - "eco give {player} 10"
        - "eterreward pass xp {player} 25 event"
      reward-rare:
        - "eco give {player} 40"
        - "eterreward pass xp {player} 100 event"
      reward-all:
        - "eco give {player} 1000"
        - "eterreward pass xp {player} 1200 event"
      milestones: {}
    noel:
      start: "12-15"
      end: "01-05"
      hide-when-closed: true
      reward-each:
        - "eco give {player} 10"
        - "eterreward pass xp {player} 25 event"
      reward-rare:
        - "eco give {player} 40"
        - "eterreward pass xp {player} 100 event"
      reward-all:
        - "eco give {player} 1000"
        - "eterreward pass xp {player} 1200 event"
      milestones: {}

# Hologrammes : /eterhub holo create <id> <text|players|board|progress> [argument]
#   players <serveur> · board <classement> [time|grams|minutes] (success, playtime_total, monthly_general, clans,
#   hub_fishing, hub_parkour_<id>...) · progress (chaque joueur voit la sienne).
holograms:
  board-size: 10

# ---------- Navigation ----------
# Sélecteur de serveurs (/servers), 5 lignes (cases 10 à 16, 19 à 25, 28 à 34 ; 36 = Reprendre, 40 = retour).
#   icon, slot ; capacity : joueurs max (barre de remplissage, « plein » ; 0 = sans) ; soon : « bientôt » ;
#   command : commande lancée au lieu d'une connexion ; action : action d'EterLib au lieu d'une connexion.
# Nom affiché : EterLib (server-display-name du serveur) ; description : lang/ selector.description.<serveur>.
# Maintenance : /eterhub maintenance <serveur> on|off (le staff passe : eterhub.maintenance.bypass).
selector:
  servers:
    eter-survival-europe-001:
      icon: GRASS_BLOCK
      slot: 22
      capacity: 0

# Portails du Nether du lobby : y entrer ouvre le sélecteur (un seul menu par passage). false : portails normaux.
portals:
  open-selector: true

# Choix du lobby (/lobbies) : les lobbys où EterHub tourne s'y ajoutent seuls ; le moins rempli est conseillé.
lobbies:
  icon: BEACON
  # Joueurs max par lobby pour la barre de remplissage (0 = sans).
  capacity: 20

# Menus : bouton en bas. Avec une commande (sans le /), il la lance et relie les menus ; vide, il ferme.
menus:
  selector:
    back-command: "menu travel"
  lobbies:
    back-command: "menu travel"
  map:
    back-command: ""
  activities:
    back-command: ""
